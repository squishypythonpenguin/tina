<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PAPALAND</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background-color: #ff69b4;
  background-image: repeating-linear-gradient(
    45deg,
    #ff69b4 0px, #ff69b4 10px,
    #ff1493 10px, #ff1493 20px
  );
  min-height: 100vh;
  font-family: 'Comic Neue', 'Comic Sans MS', cursive;
  cursor: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32'><text y='28' font-size='28'>♥</text></svg>"), auto;
}

h1 {
  text-align: center;
  font-size: 72px;
  color: yellow;
  text-shadow: 4px 4px 0 red, 7px 7px 0 black;
  padding: 30px 0 10px;
  font-family: 'Comic Neue', 'Comic Sans MS', cursive;
  transform: rotate(-2deg);
  display: block;
}

.marquee-wrap {
  background: yellow;
  border-top: 4px solid black;
  border-bottom: 4px solid black;
  overflow: hidden;
  white-space: nowrap;
  padding: 6px 0;
}
marquee {
  font-size: 22px;
  color: red;
  font-family: 'Comic Neue', 'Comic Sans MS', cursive;
  font-weight: bold;
  letter-spacing: 4px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 30px;
  padding: 40px;
  max-width: 960px;
  margin: 0 auto;
}

.card-wrap {
  perspective: 1000px;
  height: 300px;
}

.card {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  cursor: pointer;
}

.card.flipped {
  transform: rotateY(180deg);
}

.card-front, .card-back {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border: 5px solid black;
}

.card-front {
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 120px;
  line-height: 1;
  box-shadow: 8px 8px 0 black;
}

.card-back {
  transform: rotateY(180deg);
  background: #000;
  overflow: hidden;
  box-shadow: 8px 8px 0 black;
}

.card-back img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* each card slightly wonky */
.card-wrap:nth-child(1) { transform: rotate(2deg); }
.card-wrap:nth-child(2) { transform: rotate(-3deg); }
.card-wrap:nth-child(3) { transform: rotate(1deg); }
.card-wrap:nth-child(4) { transform: rotate(-2deg); }
.card-wrap:nth-child(5) { transform: rotate(3deg); }
.card-wrap:nth-child(6) { transform: rotate(-1deg); }

footer {
  text-align: center;
  padding: 30px;
  font-size: 14px;
  color: black;
  font-family: 'Comic Neue', 'Comic Sans MS', cursive;
  font-weight: bold;
}

.blink {
  animation: blink 0.8s step-start infinite;
}
@keyframes blink {
  50% { opacity: 0; }
}

.star-bg {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.star {
  position: absolute;
  font-size: 20px;
  animation: twinkle 2s infinite alternate;
  opacity: 0.6;
}
@keyframes twinkle {
  from { opacity: 0.3; transform: scale(0.8); }
  to   { opacity: 0.9; transform: scale(1.2); }
}

.grid { position: relative; z-index: 1; }
h1, .marquee-wrap, footer { position: relative; z-index: 1; }
</style>
</head>
